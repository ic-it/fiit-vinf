<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="title desc">
<title id="title">Fish species search: crawler and independent stages</title>
<desc id="desc">Configured seeds enter preferred and ordinary FIFO queues. Scope, robots and pacing gate HTTP requests. Successful HTML is saved unchanged with metadata and links. Regex discovery resolves and deduplicates new URLs back into the frontier. Failures retain tasks and cooldowns. Separate parse, index and search commands use separate directories and shared core contracts.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#45647d"/></marker></defs>
