<g font-size="17" font-weight="bold">
<text x="65" y="183">Configured seeds</text><text x="273" y="183">Saved frontier</text>
<text x="531" y="183">Request policy</text><text x="789" y="183">HTTP request</text>
<text x="997" y="183">Committed raw packet</text><text x="533" y="334">REGEX link discovery</text>
</g>
<g font-size="15">
<text x="65" y="211">Arbitrary URLs</text><text x="65" y="238">Host / depth limits</text>
<text x="273" y="211">Preferred FIFO → FIFO</text><text x="273" y="238">UUID task buckets + cursor</text>
<text x="531" y="211">Scope + robots rules</text><text x="531" y="238">Saved pacing / cooldowns</text>
<text x="789" y="211">Timeouts / redirects</text><text x="789" y="238">Bounded response</text>
<text x="997" y="211">Original HTML + metadata</text><text x="997" y="238">Links + checksums; gzip/xz</text>
<text x="533" y="359">Resolve relative URLs → normalize → scope check</text>
<text x="533" y="382">UUID membership check → append only new tasks</text>
<text x="48" y="431">Failures remain retryable. Worker claims, attempts and clocks survive restarts. One writer commits recoverable batches.</text>
</g>
