<g font-family="Arial, sans-serif" fill="#18334a">
<text x="38" y="44" font-size="27" font-weight="bold">Fish species search</text>
<text x="38" y="73" font-size="16">Four independent commands · separate file artifacts · no database</text>
<rect x="28" y="98" width="1224" height="365" rx="14" fill="#e5eff8"/>
<text x="48" y="129" font-size="20" font-weight="bold">1. Crawl — generic URL traversal</text>
<g fill="white" stroke="#9fb7c9" stroke-width="1.5">
