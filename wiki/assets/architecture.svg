<text x="57" y="756" font-size="15">Pydantic DTOs · compressed streams · atomic writes · locks · checksums · Unicode tokens · index readers</text>
<text x="38" y="807" font-size="15">Python 3.12 + uv · Typer / Rich CLI · FishBase extraction adapter today; Wikipedia linking is a later stage</text>
</g></svg>
