[project]
name = "vinf-spark"
version = "0.10.0"
description = "Independent Spark extraction and evidence-based Wikipedia joins."
requires-python = ">=3.12"
dependencies = ["vinf-core", "vinf-parsing", "requests>=2.32,<3"]

[project.optional-dependencies]
local = ["pyspark==3.5.9", "jdk4py>=17,<18"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
vinf-core = { workspace = true }
vinf-parsing = { workspace = true }
